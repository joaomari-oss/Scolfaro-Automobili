services:
  - type: web
    name: scolfaro-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://joaomari-oss.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIPE_API_TOKEN
        sync: false
